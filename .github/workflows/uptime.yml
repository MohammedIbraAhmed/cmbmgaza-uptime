name: Uptime

# Every 10 minutes (GitHub may start a run a few minutes late). On a problem it opens an issue
# labelled "down" (GitHub emails the owner); while the problem lasts it only updates that issue,
# commenting when a new check fails; when all is well again it comments and closes it.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Add a fake failure, to test that the alert email arrives'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: uptime

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the services
        id: check
        env:
          TEST_ALERT: ${{ inputs.test_alert && '1' || '' }}
        run: |
          set +e
          ./check.sh | tee result.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the alert
        run: |
          gh label create down --color B60205 --description 'A CMBM Gaza service is down' 2>/dev/null || true
          open=$(gh issue list --label down --state open --json number -q '.[0].number')
          when=$(TZ=Asia/Gaza date '+%Y-%m-%d %H:%M')
          failing=$(grep '^✗' result.txt | sed 's/^✗ //')
          if [ "${{ steps.check.outputs.status }}" != 0 ]; then
            body=$(printf 'Found at %s (Gaza time), checked from outside the server:\n\n```\n%s\n```\n\nThis issue closes by itself when everything works again. @%s' "$when" "$(cat result.txt)" "${{ github.repository_owner }}")
            if [ -z "$open" ]; then
              gh issue create --label down --title "Down: $(echo "$failing" | paste -sd ',' | sed 's/,/, /g')" --body "$body"
            else
              before=$(gh issue view "$open" --json body -q .body)
              new=$(echo "$failing" | while read -r line; do [[ "$before" == *"✗ $line"* ]] || echo "$line"; done)
              gh issue edit "$open" --body "$body"
              if [ -n "$new" ]; then gh issue comment "$open" --body "Also failing now ($when): $(echo "$new" | paste -sd ',' | sed 's/,/, /g')"; fi
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "Everything works again ($when, Gaza time)."
            gh issue close "$open"
          fi

      # GitHub pauses scheduled runs in a public repo after 60 days without commits.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $((45 * 86400)) ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'keep the uptime schedule alive'
            git push
          fi
